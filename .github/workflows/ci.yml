name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type-check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # Strict install — fails immediately if package-lock.json is out of sync
      # with any package.json in the monorepo, preventing the exact class of
      # Render build failures we had (missing vitest lock entries).
      - name: Install dependencies (strict)
        run: npm ci

      - name: Type-check all packages
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check migration files are valid SQL filenames
        run: |
          # packages/database/migrations and supabase/migrations are NOT a
          # 1:1 mirror (confirmed false in Phase 1 — see docs/AUDIT.md's
          # "known gaps" note). Until Phase 2's reconciliation work (which
          # set reflects the real deployed schema), this just guards against
          # obviously malformed migration filenames landing in either set.
          for f in packages/database/migrations/*.sql supabase/migrations/*.sql; do
            base=$(basename "$f")
            if ! [[ "$base" =~ ^[0-9]+_[a-z0-9_]+\.sql$ ]]; then
              echo "::error::$f does not match the expected <number>_<name>.sql convention"
              exit 1
            fi
          done
