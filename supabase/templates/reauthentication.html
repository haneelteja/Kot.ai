<div style="background-color:#F5F5F3; padding:40px 16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;border-collapse:collapse;">
    <tr>
      <td style="text-align:center; padding-bottom:32px;">
        <img src="https://kot-ai-rust.vercel.app/brand/kotai-logo-light-tagline.png" alt="KOT.ai" height="40" style="height:40px;border:0;">

    </tr>
    <tr>

        <p style="margin:0; font-size:12px; line-height:18px; color:#A9ADB5;">Orders, straight to the kitchen.<br>&copy; 2026 KOT.ai</p>

    </tr>

</div>
